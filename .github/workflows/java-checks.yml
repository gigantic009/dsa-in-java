name: Java DSA checks

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile each Java source independently
        run: |
          set -e
          count=0
          while IFS= read -r -d '' file; do
            out="$(mktemp -d)"
            javac -Xlint:all -d "$out" "$file"
            rm -rf "$out"
            count=$((count + 1))
          done < <(find . -name '*.java' -print0)
          echo "Compiled $count Java source files independently."
