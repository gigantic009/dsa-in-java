name: Java DSA checks

on:
  push:
    branches: [main, feature/topic-wise-dsa-course]
  pull_request:
    branches: [main]

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile each solution in isolation
        run: |
          set -euo pipefail
          mkdir -p out
          count=0
          while IFS= read -r -d '' file; do
            count=$((count + 1))
            dir="out/$count"
            mkdir -p "$dir"
            echo "Compiling: $file"
            javac -d "$dir" "$file"
          done < <(find . -name '*.java' -not -path './out/*' -print0)
          echo "Successfully compiled $count Java source files individually."
