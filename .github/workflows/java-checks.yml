name: Java DSA checks

on:
  push:
    branches: [main, feature/topic-wise-dsa-course]
  pull_request:
    branches: [main]

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile all Java solutions
        run: |
          mkdir -p out
          find . -name '*.java' -print0 | xargs -0 javac -d out
