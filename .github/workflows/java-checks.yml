name: Java DSA checks

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile Arrays branch sources together
        run: |
          set -e
          mkdir -p out-arrays
          find 03-Arrays -name '*.java' -print0 | xargs -0 javac -Xlint:all -d out-arrays
      - name: Compile shared solution examples independently
        run: |
          set -e
          for file in solutions/*.java; do
            out="$(mktemp -d)"
            javac -Xlint:all -d "$out" "$file"
            rm -rf "$out"
          done
