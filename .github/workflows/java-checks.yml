name: Java DSA checks

on:
  push:
  pull_request:
    branches: [main]

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile each solution in isolation (with known shared dependency)
        run: |
          set -euo pipefail
          mkdir -p out
          count=0
          # Compile the Kruskal/Union-Find pair together because they depend on each other.
          mkdir -p out/graph-mst
          javac -d out/graph-mst 17-Graphs/05-Part-5-MST-and-Disjoint-Set/UnionFind.java 17-Graphs/05-Part-5-MST-and-Disjoint-Set/KruskalMST.java
          count=$((count + 2))
          while IFS= read -r -d '' file; do
            case "$file" in
              *17-Graphs/05-Part-5-MST-and-Disjoint-Set/UnionFind.java|*17-Graphs/05-Part-5-MST-and-Disjoint-Set/KruskalMST.java) continue ;;
            esac
            count=$((count + 1))
            dir="out/$count"
            mkdir -p "$dir"
            echo "Compiling: $file"
            javac -d "$dir" "$file"
          done < <(find . -name '*.java' -not -path './out/*' -not -path './tests/*' -print0)
          echo "Successfully compiled $count Java source files (dependency pair compiled together)."

      - name: Run focused regression tests
        run: |
          set -euo pipefail
          mkdir -p out/regression
          javac -d out/regression tests/java/AuditRegressionTests.java 03-Arrays/02-Searching/MedianOfTwoSortedArrays.java 03-Arrays/LeetCode/Easy/LeetCode-121-BestTimeToBuyAndSellStock.java 03-Arrays/LeetCode/Easy/LeetCode-217-ContainsDuplicate.java 03-Arrays/LeetCode/Easy/LeetCode-53-MaximumSubarray.java 03-Arrays/LeetCode/Moderate/LeetCode-238-ProductOfArrayExceptSelf.java 03-Arrays/LeetCode/Moderate/LeetCode-287-FindTheDuplicateNumber.java 03-Arrays/LeetCode/Advanced/LeetCode-42-TrappingRainWater.java 17-Graphs/04-Part-4-Shortest-Paths/Dijkstra.java 17-Graphs/05-Part-5-MST-and-Disjoint-Set/UnionFind.java 17-Graphs/05-Part-5-MST-and-Disjoint-Set/KruskalMST.java 22-Segment-Trees/01-Segment-Tree-Fundamentals/SegmentTree.java 22-Segment-Trees/02-Range-Queries/RangeMinimumSegmentTree.java 12-Stacks/02-Part-B-Monotonic-Stack/LargestRectangleHistogram.java
          java -cp out/regression AuditRegressionTests

      - name: Check internal Markdown navigation
        run: python3 scripts/check_markdown_links.py
