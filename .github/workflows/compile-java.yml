name: Compile Java DSA Files

on:
  push:
    branches: [main, 'audit-*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile every non-graph Java source independently
        shell: bash
        run: |
          set -e
          count=0
          failures=0
          mkdir -p compile-results
          while IFS= read -r -d '' file; do
            case "$file" in
              ./17-Graphs/*|./tests/*) continue ;;
            esac
            count=$((count + 1))
            out="compile-results/$count"
            mkdir -p "$out"
            if javac -sourcepath . -d "$out" "$file" 2> "$out/error.txt"; then
              echo "PASS: $file"
            else
              failures=$((failures + 1))
              echo "FAIL: $file"
              cat "$out/error.txt"
            fi
          done < <(find . -name '*.java' -not -path './compile-results/*' -print0)
          echo "Checked $count non-graph Java files; failures: $failures"
          if [ "$failures" -gt 0 ]; then exit 1; fi
      - name: Compile and run greedy algorithm tests
        shell: bash
        run: |
          set -e
          mkdir -p compile-results/greedy-tests
          javac -d compile-results/greedy-tests \
            18-Greedy/01-Greedy-Fundamentals/*.java \
            18-Greedy/02-Greedy-Problem-Patterns/*.java \
            tests/GreedyAlgorithmsTest.java
          java -cp compile-results/greedy-tests GreedyAlgorithmsTest
      - name: Compile and run matrix algorithm tests
        shell: bash
        run: |
          set -e
          mkdir -p compile-results/matrix-tests
          javac -d compile-results/matrix-tests \
            05-Two-D-Arrays/01-Matrix-Fundamentals/*.java \
            tests/MatrixAlgorithmsTest.java
          java -cp compile-results/matrix-tests MatrixAlgorithmsTest
      - name: Compile the Graphs module together
        shell: bash
        run: |
          set -e
          mkdir -p compile-results/graphs
          mapfile -t graph_files < <(find 17-Graphs -name '*.java' -print)
          javac -d compile-results/graphs "${graph_files[@]}"
          echo "Compiled Graphs module source files."
