name: Compile Java DSA Files

on:
  push:
    branches: [main, audit-graphs-readable]
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile every non-graph Java source independently
        shell: bash
        run: |
          set -e
          count=0
          failures=0
          mkdir -p compile-results
          while IFS= read -r -d '' file; do
            case "$file" in
              ./17-Graphs/*|./tests/*) continue ;;
            esac
            count=$((count + 1))
            out="compile-results/$count"
            mkdir -p "$out"
            if javac -sourcepath . -d "$out" "$file" 2> "$out/error.txt"; then
              echo "PASS: $file"
            else
              failures=$((failures + 1))
              echo "FAIL: $file"
              cat "$out/error.txt"
            fi
          done < <(find . -name '*.java' -not -path './compile-results/*' -print0)
          echo "Checked $count non-graph Java files; failures: $failures"
          if [ "$failures" -gt 0 ]; then exit 1; fi
      - name: Compile the Graphs module together
        shell: bash
        run: |
          set -e
          mkdir -p compile-results/graphs
          mapfile -t graph_files < <(find 17-Graphs -name '*.java' -print)
          javac -d compile-results/graphs "${graph_files[@]}"
          echo "Compiled Graphs module source files."
      - name: Run temporary readability smoke tests
        shell: bash
        run: |
          set -e
          javac -cp compile-results/graphs -d compile-results/graphs             11-Linked-Lists/01-Part-A-Singly-Linked-List/LinkedListPalindrome.java             12-Stacks/01-Part-A-Fundamentals/MinStack.java             12-Stacks/01-Part-A-Fundamentals/PostfixEvaluation.java             12-Stacks/02-Part-B-Monotonic-Stack/NextSmallerElement.java             13-Queues/01-Queue-Fundamentals/CircularQueue.java             13-Queues/02-Queue-Problem-Patterns/FirstNegativeInWindow.java             13-Queues/02-Queue-Problem-Patterns/FirstNonRepeatingCharacter.java             13-Queues/02-Queue-Problem-Patterns/GenerateBinaryNumbers.java
          javac -cp compile-results/graphs -d compile-results/graphs tests/TemporaryAuditSmokeTest.java
          java -cp compile-results/graphs TemporaryAuditSmokeTest
